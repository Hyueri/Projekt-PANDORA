<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error 404</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f7f3eb;
            color: #000000;
            font-family: 'MS PGothic', 'Hiragino Kaku Gothic ProN', Arial, sans-serif;
        }

        .error-shell {
            width: min(720px, 90vw);
            background: #ffffff;
            border: 1px solid #111111;
            padding: 28px 24px;
            box-shadow: none;
        }

        .error-shell h1 {
            margin-top: 0;
            margin-bottom: 18px;
            font-size: clamp(28px, 5vw, 42px);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #000000;
        }

        .error-shell p,
        .error-shell a {
            font-size: 14px;
            line-height: 1.8;
            color: #000000;
        }

        .error-shell a {
            display: inline-block;
            margin-top: 8px;
            color: #000000;
            text-decoration: underline;
        }

        .error-shell a:hover {
            color: #333333;
        }

        .delayed-content {
            margin-top: 26px;
            padding-top: 16px;
            border-top: 1px solid #111111;
        }

        .hidden-line {
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 1.2s ease, transform 1.2s ease;
            max-height: 0;
            overflow: hidden;
            margin: 0;
        }

        .hidden-line.visible {
            opacity: 1;
            transform: translateY(0);
            max-height: 80px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <audio id="404msc" preload="auto" autoplay loop>
        <source src="audio/Result Failed.mp3" type="audio/mpeg">
    </audio>

    <div class="error-shell">
        <h1>404 - Page Not Found</h1>
        <p>Sorry, the page you are looking for does not exist.</p>
        <p>How in the hell did you get in here? Quick, get out!</p>
        <a href="index.html">RETURN</a>

        <div class="delayed-content">
            <p class="hidden-line">...</p>
            <p class="hidden-line">Wait, something isn't right</p>
            <p class="hidden-line">Ёif@Ё·ДЁi@tqfБ@if·f</p>
            <a id="archive-access" class="hidden-line" href="archive.html">[access]</a>
        </div>
    </div>

    <script>
        const delayedLines = document.querySelectorAll('.hidden-line');
        const errormsc = document.getElementById('404msc');
        const archiveAccess = document.getElementById('archive-access');

        if (sessionStorage.getItem('archiveLocked') === 'true') {
            window.location.replace('archive.html');
        } else if (sessionStorage.getItem('errorEntryToken') !== 'true') {
            window.location.replace('index.html');
        } else {
            sessionStorage.removeItem('errorEntryToken');
            sessionStorage.setItem('errorPageActive', 'true');

            if (archiveAccess) {
                archiveAccess.addEventListener('click', () => {
                    sessionStorage.setItem('archiveEntryToken', 'true');
                    sessionStorage.removeItem('errorPageActive');
                });
            }
        }

        if (errormsc) {
            errormsc.volume = 0.25;
            errormsc.play().catch(() => {});
        }

        setTimeout(() => {
            delayedLines.forEach((line, index) => {
                setTimeout(() => {
                    line.classList.add('visible');
                }, index * 10000);
            });
        }, 15000);
    </script>
</body>
</html>
